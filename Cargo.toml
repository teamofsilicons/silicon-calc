[workspace]
resolver = "3"
members = ["crates/calc-engine", "crates/calc-runner", "crates/calc-ting", "crates/calc-api", "crates/silicon-calc-client", "crates/calc-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/teamofsilicons/silicon-calc"
rust-version = "1.90"

[workspace.dependencies]
calc-engine = { path = "crates/calc-engine" }
calc-runner = { path = "crates/calc-runner" }
calc-ting = { path = "crates/calc-ting" }
silicon-calc-client = { path = "crates/silicon-calc-client" }
silicon-accounts-client = "0.6"
axum = { version = "0.8", features = ["ws", "macros", "multipart"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time", "json", "macros", "migrate"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream", "multipart", "query"] }
tower-http = { version = "0.7", features = ["cors", "trace", "limit"] }
clap = { version = "4", features = ["derive", "env"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
rand = "0.9"
base64 = "0.22"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
async-stream = "0.3"
lru = "0.16"
csv = "1"
calamine = "0.36"
rust_xlsxwriter = "0.99"
zip = { version = "6", default-features = false, features = ["deflate"] }
quick-xml = "0.38"
rmp-serde = "1"
zstd = "0.13"
ahash = "0.8"
duckdb = { version = "1.10506", features = ["bundled"] }
bytes = "1"
secrecy = "0.10"
sha2 = "0.10"
hex = "0.4"
url = "2"
comfy-table = "7"

[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 2
