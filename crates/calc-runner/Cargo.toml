[package]
name = "calc-runner"
description = "Trusted spreadsheet file converters for Parquet, LibreOffice formats and Apple Numbers"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
calc-engine.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
rand.workspace = true
libc.workspace = true
# DuckDB reads and writes Parquet in-process; appender-arrow loads workbook columns.
# Existing features are retained to avoid a second bundled DuckDB build.
duckdb = { workspace = true, features = ["parquet", "json", "appender-arrow"] }

[dev-dependencies]
calamine.workspace = true
