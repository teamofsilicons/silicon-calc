[package]
name = "calc-ting"
description = "Sends Silicon Calc's notifications to Silicon Ting with Calc's App verification proof"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
silicon-accounts-client.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
futures.workspace = true
time.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true
# wss:// to Silicon Ting: one explicit crypto provider (the workspace builds rustls with two, so rustls can't pick).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

[dev-dependencies]
axum.workspace = true
base64.workspace = true
reqwest.workspace = true
