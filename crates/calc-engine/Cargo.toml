[package]
name = "calc-engine"
description = "Silicon Calc's spreadsheet engine: the workbook, formulas, recalculation, history operations, diff and merge, and file formats"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
csv.workspace = true
calamine.workspace = true
rust_xlsxwriter.workspace = true
rmp-serde.workspace = true
zstd.workspace = true
ahash.workspace = true
rand.workspace = true
# File formats: the same zip and XML versions calamine and rust_xlsxwriter use, so each is built once.
zip = { version = "8.6", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
# CSV/TSV in UTF-16 and Windows-1252.
encoding_rs = "0.8"
# PDF content streams.
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }

[dev-dependencies]

[features]
# Temporary: compiles format modules that are still being written (only the formats work item enables it).
formats-wip = []
